[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "anishelf-cli"
version = "0.1.1"
description = "Read-only AniShelf and CloudKit inspection CLI."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Samuel He" }]
keywords = ["anishelf", "cloudkit", "tmdb", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Utilities",
]
dependencies = [
  "filelock>=3.19.1",
  "httpx[socks]>=0.28.1",
  "keyring>=25.6.0",
  "keyrings.alt>=5.0.2",
  "pydantic>=2.11.7",
  "rich>=14.1.0",
  # Typer 0.27 renders help metavars as `{query}` / `<str>`; keep the tested format.
  "typer>=0.16.1,<0.27",
]

[project.scripts]
ani = "anishelf_cli.app:main"

[project.urls]
Homepage = "https://github.com/samuelhe52/anishelf-cli"
Repository = "https://github.com/samuelhe52/anishelf-cli"
Issues = "https://github.com/samuelhe52/anishelf-cli/issues"
Changelog = "https://github.com/samuelhe52/anishelf-cli/releases"

[dependency-groups]
dev = ["mypy>=1.17.1", "pytest>=8.4.1", "pytest-cov>=6.2.1", "ruff>=0.12.2"]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/Makefile",
  "/README.md",
  "/docs",
  "/pyproject.toml",
  "/skills",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anishelf_cli"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
packages = ["anishelf_cli"]
