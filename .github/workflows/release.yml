name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft-release:
    name: Build and draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Check tag matches package version
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}." >&2
            exit 1
          fi

      - name: Run checks
        run: |
          make sync
          make check

      - name: Build distributions
        run: uv build

      - name: Create draft release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes "## Changes"$'\n\n'"- TODO: summarize user-visible changes before publishing."
